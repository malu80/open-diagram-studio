<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Diagram Studio is a fast, expressive, local-first canvas for mapping ideas and systems."
    />
    <title>Diagram Studio | Make ideas impossible to miss</title>
    <script>
      // Apply the saved theme before first paint, so the board never flashes
      // the wrong one. Mirrors readStoredTheme/applyTheme in
      // src/stores/ui-store.ts — change both together.
      try {
        var saved = localStorage.getItem('diagram-studio:theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (error) {
        // Storage blocked: fall through to the system preference.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
